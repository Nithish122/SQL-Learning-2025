<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients and styles -->
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="inputGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="processingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="analysisGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="outputGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  
  <!-- Title Section -->
  <rect width="1400" height="100" fill="url(#headerGradient)" filter="url(#shadow)"/>
  <text x="700" y="50" font-size="42" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
    Release Validation Copilot
  </text>
  <text x="700" y="80" font-size="16" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="Arial, sans-serif">
    Power BI Version Comparison & Regression Testing Framework
  </text>
  
  <!-- LAYER 1: INPUT SOURCES -->
  <g>
    <!-- Title -->
    <text x="50" y="145" font-size="14" font-weight="bold" fill="#667eea" font-family="Arial, sans-serif">LAYER 1: INPUT SOURCES</text>
    
    <!-- Input Box 1 -->
    <rect x="50" y="165" width="220" height="120" fill="url(#inputGradient)" rx="10" filter="url(#shadow)"/>
    <text x="160" y="190" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">GitHub PBIP Repository</text>
    <text x="160" y="210" font-size="11" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Version 1</text>
    <circle cx="110" cy="250" r="4" fill="white"/>
    <text x="125" y="255" font-size="10" fill="white" font-family="Arial, sans-serif">.pbip files</text>
    <circle cx="110" cy="270" r="4" fill="white"/>
    <text x="125" y="275" font-size="10" fill="white" font-family="Arial, sans-serif">Metadata</text>
    
    <!-- Input Box 2 -->
    <rect x="310" y="165" width="220" height="120" fill="url(#inputGradient)" rx="10" filter="url(#shadow)"/>
    <text x="420" y="190" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">GitHub PBIP Repository</text>
    <text x="420" y="210" font-size="11" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Version 2</text>
    <circle cx="370" cy="250" r="4" fill="white"/>
    <text x="385" y="255" font-size="10" fill="white" font-family="Arial, sans-serif">.pbip files</text>
    <circle cx="370" cy="270" r="4" fill="white"/>
    <text x="385" y="275" font-size="10" fill="white" font-family="Arial, sans-serif">Metadata</text>
    
    <!-- Input Box 3 -->
    <rect x="570" y="165" width="220" height="120" fill="url(#inputGradient)" rx="10" filter="url(#shadow)"/>
    <text x="680" y="190" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Power BI Files</text>
    <text x="680" y="210" font-size="11" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Additional Assets</text>
    <circle cx="630" cy="250" r="4" fill="white"/>
    <text x="645" y="255" font-size="10" fill="white" font-family="Arial, sans-serif">.pbix format</text>
    <circle cx="630" cy="270" r="4" fill="white"/>
    <text x="645" y="275" font-size="10" fill="white" font-family="Arial, sans-serif">Config files</text>
  </g>
  
  <!-- Arrows from Layer 1 to Layer 2 -->
  <path d="M 160 285 L 160 325" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 420 285 L 420 325" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 680 285 L 680 325" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- LAYER 2: VERSION EXTRACTION & COMPARISON ENGINE -->
  <g>
    <text x="50" y="340" font-size="14" font-weight="bold" fill="#4facfe" font-family="Arial, sans-serif">LAYER 2: EXTRACTION & COMPARISON ENGINE</text>
    
    <!-- Main Processing Box -->
    <rect x="50" y="360" width="740" height="110" fill="url(#processingGradient)" rx="10" filter="url(#shadow)"/>
    
    <!-- Internal components -->
    <g font-family="Arial, sans-serif" font-size="11" fill="white">
      <circle cx="100" cy="390" r="3"/>
      <text x="115" y="395">File Structure Analyzer</text>
      
      <circle cx="100" cy="410" r="3"/>
      <text x="115" y="415">PBIP/PBIX Parser</text>
      
      <circle cx="100" cy="430" r="3"/>
      <text x="115" y="435">Metadata Extractor</text>
      
      <circle cx="100" cy="450" r="3"/>
      <text x="115" y="455">Semantic Diff Algorithm</text>
      
      <!-- Right side components -->
      <circle cx="450" cy="390" r="3"/>
      <text x="465" y="395">Schema Comparator</text>
      
      <circle cx="450" cy="410" r="3"/>
      <text x="465" y="415">DAX Formula Analyzer</text>
      
      <circle cx="450" cy="430" r="3"/>
      <text x="465" y="435">Visual Structure Detector</text>
      
      <circle cx="450" cy="450" r="3"/>
      <text x="465" y="455">Relationship Mapper</text>
    </g>
  </g>
  
  <!-- Arrow from Layer 2 to Layer 3 -->
  <path d="M 420 470 L 420 520" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- LAYER 3: CHANGE DETECTION -->
  <g>
    <text x="50" y="535" font-size="14" font-weight="bold" fill="#43e97b" font-family="Arial, sans-serif">LAYER 3: CHANGE DETECTION & CATEGORIZATION</text>
    
    <!-- Change Detection Boxes -->
    <rect x="50" y="555" width="150" height="100" fill="url(#analysisGradient)" rx="8" filter="url(#shadow)"/>
    <text x="125" y="580" font-size="12" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Data Model</text>
    <text x="125" y="600" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">• Tables</text>
    <text x="125" y="615" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">• Columns</text>
    <text x="125" y="630" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">• Relationships</text>
    
    <rect x="220" y="555" width="150" height="100" fill="url(#analysisGradient)" rx="8" filter="url(#shadow)"/>
    <text x="295" y="580" font-size="12" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Report Layout</text>
    <text x="295" y="600" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">• Pages</text>
    <text x="295" y="615" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">• Visuals</text>
    <text x="295" y="630" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">• Filters</text>
    
    <rect x="390" y="555" width="150" height="100" fill="url(#analysisGradient)" rx="8" filter="url(#shadow)"/>
    <text x="465" y="580" font-size="12" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">DAX & Formulas</text>
    <text x="465" y="600" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">• Measures</text>
    <text x="465" y="615" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">• Calculated Cols</text>
    <text x="465" y="630" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">• RLS Rules</text>
    
    <rect x="560" y="555" width="150" height="100" fill="url(#analysisGradient)" rx="8" filter="url(#shadow)"/>
    <text x="635" y="580" font-size="12" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Connections</text>
    <text x="635" y="600" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">• Data Sources</text>
    <text x="635" y="615" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">• Refresh Config</text>
    <text x="635" y="630" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">• Parameters</text>
  </g>
  
  <!-- Arrow from Layer 3 to Layer 4 -->
  <path d="M 420 655 L 420 705" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- LAYER 4: IMPACT ANALYSIS -->
  <g>
    <text x="50" y="720" font-size="14" font-weight="bold" fill="#fa709a" font-family="Arial, sans-serif">LAYER 4: IMPACT ANALYSIS & RISK ASSESSMENT</text>
    
    <!-- Impact Level Boxes -->
    <rect x="50" y="740" width="180" height="90" fill="#dc3545" rx="8" filter="url(#shadow)"/>
    <text x="140" y="765" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">🔴 HIGH IMPACT</text>
    <text x="140" y="785" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Data Model Changes</text>
    <text x="140" y="800" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">DAX Formula Updates</text>
    <text x="140" y="815" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Relationship Edits</text>
    
    <rect x="250" y="740" width="180" height="90" fill="#ffc107" rx="8" filter="url(#shadow)"/>
    <text x="340" y="765" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">🟡 MEDIUM IMPACT</text>
    <text x="340" y="785" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Visual Formatting</text>
    <text x="340" y="800" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Filter Changes</text>
    <text x="340" y="815" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Layout Modifications</text>
    
    <rect x="450" y="740" width="180" height="90" fill="#28a745" rx="8" filter="url(#shadow)"/>
    <text x="540" y="765" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">🟢 LOW IMPACT</text>
    <text x="540" y="785" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">UI Polish</text>
    <text x="540" y="800" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Comments/Labels</text>
    <text x="540" y="815" font-size="9" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Minor Tweaks</text>
  </g>
  
  <!-- Arrow from Layer 4 to Layer 5 (right side) -->
  <path d="M 800 400 L 920 400" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- LAYER 5: RECOMMENDATIONS & OUTPUT (Right side) -->
  <g>
    <text x="940" y="145" font-size="14" font-weight="bold" fill="#fa709a" font-family="Arial, sans-serif">LAYER 5: TESTING RECOMMENDATIONS</text>
    
    <!-- Testing Types -->
    <rect x="940" y="165" width="420" height="280" fill="url(#outputGradient)" rx="10" filter="url(#shadow)"/>
    
    <g font-family="Arial, sans-serif" fill="white">
      <text x="1150" y="190" font-size="13" font-weight="bold" text-anchor="middle">Regression Testing Framework</text>
      
      <!-- Test Types -->
      <g font-size="10">
        <circle cx="970" cy="220" r="4"/>
        <text x="985" y="225">Report-Level Tests</text>
        <text x="1000" y="240" font-size="9" fill="rgba(255,255,255,0.9)">→ Validate full report functionality</text>
        
        <circle cx="970" cy="265" r="4"/>
        <text x="985" y="270">Page-Level Tests</text>
        <text x="1000" y="285" font-size="9" fill="rgba(255,255,255,0.9)">→ Check individual page interactions</text>
        
        <circle cx="970" cy="310" r="4"/>
        <text x="985" y="315">Visual-Level Tests</text>
        <text x="1000" y="330" font-size="9" fill="rgba(255,255,255,0.9)">→ Verify chart data & formatting</text>
        
        <circle cx="970" cy="355" r="4"/>
        <text x="985" y="360">Data Validation Tests</text>
        <text x="1000" y="375" font-size="9" fill="rgba(255,255,255,0.9)">→ Confirm data accuracy</text>
        
        <circle cx="970" cy="400" r="4"/>
        <text x="985" y="405">Performance Tests</text>
        <text x="1000" y="420" font-size="9" fill="rgba(255,255,255,0.9)">→ Load time & responsiveness</text>
      </g>
    </g>
  </g>
  
  <!-- OUTPUT SECTION -->
  <g>
    <text x="940" y="495" font-size="14" font-weight="bold" fill="#764ba2" font-family="Arial, sans-serif">DELIVERABLES</text>
    
    <!-- Report Box -->
    <rect x="940" y="510" width="420" height="85" fill="#667eea" rx="8" filter="url(#shadow)"/>
    <g font-family="Arial, sans-serif" fill="white">
      <text x="1150" y="535" font-size="12" font-weight="bold" text-anchor="middle">📊 Release Validation Report</text>
      <circle cx="970" cy="555" r="3"/>
      <text x="985" y="560" font-size="10">Changed Components Inventory</text>
      <circle cx="970" cy="575" r="3"/>
      <text x="985" y="580" font-size="10">Risk Assessment Matrix & Recommendations</text>
    </g>
    
    <!-- Checklist Box -->
    <rect x="940" y="610" width="420" height="85" fill="#28a745" rx="8" filter="url(#shadow)"/>
    <g font-family="Arial, sans-serif" fill="white">
      <text x="1150" y="635" font-size="12" font-weight="bold" text-anchor="middle">✅ Testing Checklist & Coverage Report</text>
      <circle cx="970" cy="655" r="3"/>
      <text x="985" y="660" font-size="10">Prioritized Test Cases</text>
      <circle cx="970" cy="675" r="3"/>
      <text x="985" y="680" font-size="10">GO/NO-GO Release Recommendation</text>
    </g>
  </g>
  
  <!-- Legend -->
  <g>
    <text x="50" y="860" font-size="12" font-weight="bold" fill="#333" font-family="Arial, sans-serif">Legend:</text>
    
    <rect x="50" y="870" width="15" height="15" fill="url(#inputGradient)" rx="2"/>
    <text x="75" y="882" font-size="10" fill="#333" font-family="Arial, sans-serif">Input Sources</text>
    
    <rect x="280" y="870" width="15" height="15" fill="url(#processingGradient)" rx="2"/>
    <text x="305" y="882" font-size="10" fill="#333" font-family="Arial, sans-serif">Processing Engine</text>
    
    <rect x="550" y="870" width="15" height="15" fill="url(#analysisGradient)" rx="2"/>
    <text x="575" y="882" font-size="10" fill="#333" font-family="Arial, sans-serif">Analysis & Detection</text>
    
    <rect x="820" y="870" width="15" height="15" fill="url(#outputGradient)" rx="2"/>
    <text x="845" y="882" font-size="10" fill="#333" font-family="Arial, sans-serif">Output & Recommendations</text>
  </g>
</svg>